[package]
name = "shelf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Browse and edit EPUB metadata, in your terminal"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = "0.29"
html-escape = "0.2"
opaline = "0.4.2"
quick-xml = "0.42"
ratatui = "0.30"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
toml = "0.8"
unicode-normalization = "0.1"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
